name: Crawl Sporttery Data

on:
  schedule:
    # Run at 08:00 and 16:00 UTC every day
    # 08:00 UTC = 16:00 Beijing Time (UTC+8)
    # 16:00 UTC = 00:00 Beijing Time (UTC+8)
    - cron: "0 8,16 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  crawl:
    runs-on: ubuntu-latest
    name: Fetch and ingest sporttery data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run local crawler
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python local_crawler.py
