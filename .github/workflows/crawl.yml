name: Crawl 500.com Football Data

on:
  schedule:
    # 每天 08:00 和 16:00 运行 (UTC)
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      use_direct_db:
        description: 'Use direct database connection instead of API'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: "3.11"
  API_BASE_URL: "https://football-assistant-api.onrender.com"
  DATABASE_URL: "postgresql://football_assistant_db_user:FdMXDDjAeGiHl9iIGmWbL3y3d61Gp8WQ@dpg-dat20ag473hc73edkqhg-a/football_assistant_db"
  USE_DIRECT_DB: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests asyncpg

      - name: Run crawler (API mode)
        if: github.event.inputs.use_direct_db != 'true' && env.USE_DIRECT_DB != 'true'
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: python local_crawler.py

      - name: Run crawler (Direct DB mode)
        if: github.event.inputs.use_direct_db == 'true' || env.USE_DIRECT_DB == 'true'
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          USE_DIRECT_DB: "false"
        run: python local_crawler.py

      - name: Verify data on Render
        run: |
          echo "Checking fixtures endpoint..."
          curl -s "${API_BASE_URL}/api/fixtures" | python -m json.tool | head -50
          echo ""
          echo "Checking health endpoint..."
          curl -s "${API_BASE_URL}/health" | python -m json.tool
